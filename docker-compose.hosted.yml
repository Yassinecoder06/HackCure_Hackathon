# The hosted demo (the "active web URL"): the same stack, with Caddy as the public HTTPS front door (automatic real
# certificate, TLS 1.3 only) and nothing else reachable from the internet.
#
#   python infra/gen_secrets.py && python infra/gen_certs.py          # certs are for the internal broker only
#   BORJ_DOMAIN=demo.example.org BORJ_FAMILY_DOMAIN=family.example.org docker compose -f docker-compose.yml -f docker-compose.hosted.yml up -d --build
#
# Details and the checklist: docs/deployment.md
services:
  caddy:
    image: caddy:2.8-alpine
    environment:
      BORJ_DOMAIN: ${BORJ_DOMAIN:?set BORJ_DOMAIN to the public host name}
      BORJ_FAMILY_DOMAIN: ${BORJ_FAMILY_DOMAIN:?set BORJ_FAMILY_DOMAIN to the public host name for relatives}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server: { condition: service_healthy }
      ward-app: { condition: service_healthy }
      family-gateway: { condition: service_healthy }
    networks: [ward, dmz]   # the one public hop to both faces; family-gateway itself stays dmz-only

  nginx:
    profiles: ["local-proxy"]     # Caddy replaces it on the VM
  family-proxy:
    ports: !reset []              # the ward's publisher reaches it inside the dmz network; nothing is published

  # Only Caddy is public: no direct API port, and the hosted simulator needs no outside broker access.
  server:
    ports: !reset []
    environment:
      BORJ_CORS_ORIGINS: https://${BORJ_DOMAIN}
      BORJ_FAMILY_PUBLIC_URL: https://${BORJ_FAMILY_DOMAIN}
  mosquitto:
    ports: !reset []

volumes:
  caddy-data: {}
  caddy-config: {}
