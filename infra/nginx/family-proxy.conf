# TLS 1.3 front door of the Family Care Link, on the dmz network only (safety invariants 2, 3 and 10).
#
#   443   public face: the relatives' phones. Serves the family app and /family/v1/*. NEVER /ingest.
#   4443  ward face: only reachable inside the dmz network (it is not published). The ward's family publisher
#         connects out to it and pushes approved payloads; nothing here ever connects back into the ward.
events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    upstream gateway {
        server family-gateway:8100;
    }

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    limit_req_zone $binary_remote_addr zone=relatives:10m rate=20r/s;

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # The ward pushes over the other listener. From the internet there is no way to reach it.
        location /ingest/ {
            return 404;
        }

        location / {
            limit_req zone=relatives burst=40 nodelay;
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;   # replaces anything the client sent: the gateway trusts only this
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server {
        listen 4443 ssl;
        server_name _;

        location /ingest/ {
            proxy_pass http://gateway;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            return 404;
        }
    }
}
