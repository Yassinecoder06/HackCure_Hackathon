# Broker access control (mosquitto acl_file). One account per component; a component can only publish what its
# role produces, for the topics it owns. Written for ward W1 (seed/ward-W1.yaml); tests/test_broker_acl.py checks
# that every seed bed has a node account. Passwords: infra/gen_secrets.py -> infra/.env -> broker entrypoint.
#
# Nobody but the server may publish call/state, assignment, or the internal topics (prescription, family, order):
# the server also drops those if they arrive over MQTT (server/borj_server/integrity.py).

# The ward server: reads every message, publishes only the retained call state it decides.
user server
topic read borj/#
topic write borj/W1/+/call/state

# The ward simulator (synthetic data, demo and tests). Never call/state.
user sim
topic write borj/W1/+/vitals
topic write borj/W1/+/device/status
topic write borj/W1/+/call
topic write borj/W1/+/binding
topic write borj/W1/+/med
topic write borj/W1/staff/+/presence
topic write borj/W1/staff/+/ack
topic write borj/W1/sim/clock

# The device gateway: publishes device readings, listens for bed bindings.
user gw
topic write borj/W1/+/vitals
topic write borj/W1/+/device/status
topic read borj/W1/+/binding

# Bedside node of B01: its own bed only.
user node-B01
topic write borj/W1/B01/call
topic write borj/W1/B01/device/status
topic write borj/W1/staff/+/ack
topic read borj/W1/B01/call/state

