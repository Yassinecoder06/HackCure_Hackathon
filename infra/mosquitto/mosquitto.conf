# Borj-PiCare broker (safety invariants 10, 13; HackCure spec section 5).
#
# Every network client uses the TLS 1.3 listener on 8883 with its own account and the topic rules in acl.conf.
# Plain MQTT exists only on the container's own loopback, so the healthcheck can run; nothing outside the
# container can reach it. The entrypoint creates the password file from BORJ_MQTT_USERS and copies the
# certificates (infra/certs, made by infra/gen_certs.py) into /mosquitto/run with the right owner.
per_listener_settings true

listener 8883
protocol mqtt
cafile /mosquitto/run/ca.crt
certfile /mosquitto/run/server.crt
keyfile /mosquitto/run/server.key
tls_version tlsv1.3
require_certificate false
allow_anonymous false
password_file /mosquitto/run/passwd
acl_file /mosquitto/run/acl.conf

listener 1883
protocol mqtt
allow_anonymous true

persistence false
log_dest stdout
