name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Lint, contracts, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            server/requirements.txt
            inference/requirements.txt
      - run: pip install -r requirements-dev.txt -r server/requirements.txt -r inference/requirements.txt
      - run: ruff check .
      - run: pytest

  compose:
    name: Compose stack + MQTT smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install paho-mqtt==2.1.0 jsonschema==4.26.0 referencing==0.37.0 cryptography
      - run: python3 infra/gen_secrets.py
      - run: python3 infra/gen_certs.py
      - run: docker compose config --quiet
      - run: docker compose build mosquitto postgres inference server simulator ward-app nginx
      # mqtt_smoke.py pins the demo clock and binds B04 itself. The simulator (own clock, own patients) is
      # started after it, by a later step.
      - run: docker compose up -d --wait mosquitto postgres inference server
      - name: Broker is TLS 1.3 only, authenticated, with topic ACLs
        run: python tests/integration/broker_security_smoke.py
      - name: Events flow MQTT -> twin (PostgreSQL, encrypted) -> inference -> API
        run: python tests/integration/mqtt_smoke.py
      - name: The simulator's stream is ingested
        run: |
          docker compose up -d simulator
          python tests/integration/simulator_smoke.py
      - name: HTTPS front door is TLS 1.3 only
        run: |
          docker compose up -d --wait nginx
          python tests/integration/https_smoke.py
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  apps:
    name: Apps lint, isolation, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
