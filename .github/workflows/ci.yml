name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Lint, contracts, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            server/requirements.txt
            inference/requirements.txt
      - run: pip install -r requirements-dev.txt -r server/requirements.txt -r inference/requirements.txt
      - run: ruff check .
      - run: pytest

  compose:
    name: Compose stack + MQTT smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 infra/gen_secrets.py
      - run: docker compose -f infra/docker-compose.yml config --quiet
      - run: docker compose -f infra/docker-compose.yml up -d --build --wait
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install paho-mqtt==2.1.0 jsonschema==4.26.0 referencing==0.37.0
      - name: Events flow MQTT -> twin (PostgreSQL, encrypted) -> inference -> API
        run: python tests/integration/mqtt_smoke.py
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs
      - if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  # apps:            # C adds this in the P0 task: npm ci + build + lint for apps/ward and apps/family
